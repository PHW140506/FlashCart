<main class="login-page">
  <section class="login-card" aria-labelledby="login-title">
    <div class="brand"><span class="brand-mark">F</span> FlashCart</div>
    <p class="eyebrow">ACCESO A LA APLICACIÓN</p>
    <h1 id="login-title">Iniciar sesión</h1>
    <p class="subtitle">Accede con tu usuario y contraseña para abrir tu perfil.</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username"
          [(ngModel)]="username" required [disabled]="loading()" placeholder="Tu usuario" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
          [(ngModel)]="password" required [disabled]="loading()" placeholder="Tu contraseña" />
      </div>

      @if (errorMessage()) {
        <p class="error-message" role="alert">{{ errorMessage() }}</p>
      }

      <button type="submit" class="submit-button"
        [disabled]="loading() || loginForm.invalid === true">
        {{ loading() ? 'Validando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="footer-note">Conectado al backend local de FlashCart.</p>
  </section>
</main>
